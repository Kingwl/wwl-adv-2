name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    name: Godot checks
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: "4.6.2"
      GODOT_RELEASE: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v5.0.5
        with:
          path: ~/.local/bin/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"

      - name: Verify Godot
        run: godot --version

      - name: Install UI smoke dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb python3-pil

      - name: Run project checks
        working-directory: game
        env:
          GODOT_BIN: godot
        run: |
          set -euo pipefail
          mkdir -p ../ci-artifacts
          set +e
          ./tools/check-all.sh 2>&1 | tee ../ci-artifacts/check-all.log
          status="${PIPESTATUS[0]}"
          set -e
          ./tools/summarize-godot-log.py ../ci-artifacts/check-all.log \
            --exit-status "${status}" \
            --out-dir ../ci-artifacts/godot-log
          exit "${status}"

      - name: Run native UI smoke
        working-directory: game
        env:
          GODOT_BIN: godot
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./tools/check-ui-smoke.sh

      - name: Run native gameplay smoke
        working-directory: game
        env:
          GODOT_BIN: godot
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./tools/check-gameplay-smoke.sh

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: godot-check-artifacts
          path: ci-artifacts/
          if-no-files-found: warn
